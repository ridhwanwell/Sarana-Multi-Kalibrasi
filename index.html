<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/brand/smk-logo-light.png" />
    <link rel="icon" type="image/webp" href="/logo-smk.webp" />
    <link rel="icon" type="image/svg+xml" href="/logo-smk.svg" />
    <title>Manajemen Aset SMK</title>
    <meta name="theme-color" content="#121B21" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Pasang tema sebelum halaman tampil (mencegah kedip putih). Halaman scan QR publik selalu terang.
      (function () {
        try {
          var p = location.pathname, q = location.search;
          var isPortal = p === '/' || p === '' || p === '/portal-aset' || p.indexOf('/admin') === 0;
          if ((p === '/' || p === '') && /[?&](noLabel|nolabel|label|cert|no_label)=/.test(q)) isPortal = false;
          var t = localStorage.getItem('smk_theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          var eff = isPortal ? t : 'light';
          document.documentElement.setAttribute('data-theme', eff);
          document.documentElement.style.colorScheme = eff;
          if (localStorage.getItem('smk_sidebar_collapsed') === '1') document.documentElement.classList.add('sb-collapsed');
        } catch (e) {}
      })();
    </script>
    <script>
      // Tera SMK (PWA, wilayah /tera/): kartu identitas, ikon, warna status bar, judul, penjaga gudang.
      // Hanya untuk alamat /tera… — halaman publik scan QR TIDAK diberi manifest/service worker.
      (function () {
        try {
          var p = location.pathname;
          if (!(p === '/tera' || p.indexOf('/tera/') === 0)) return;
          var h = document.head;
          var buang = h.querySelectorAll('link[rel="icon"], meta[name="theme-color"]');
          for (var i = 0; i < buang.length; i++) buang[i].parentNode.removeChild(buang[i]);
          var pasang = function (tag, attrs) {
            var el = document.createElement(tag);
            for (var k in attrs) el.setAttribute(k, attrs[k]);
            h.appendChild(el);
          };
          pasang('link', { rel: 'manifest', href: '/tera/manifest.webmanifest' });
          pasang('link', { rel: 'icon', type: 'image/png', href: '/tera/tera-icon-192.png' });
          pasang('link', { rel: 'apple-touch-icon', href: '/tera/tera-apple-touch-icon-180.png' });
          pasang('meta', { name: 'apple-mobile-web-app-title', content: 'Tera SMK' });
          pasang('meta', { name: 'mobile-web-app-capable', content: 'yes' });
          pasang('meta', { name: 'apple-mobile-web-app-capable', content: 'yes' });
          pasang('meta', { name: 'theme-color', content: '#0B6FB3', media: '(prefers-color-scheme: light)' });
          pasang('meta', { name: 'theme-color', content: '#0F2742', media: '(prefers-color-scheme: dark)' });
          document.title = 'Tera SMK';
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
              navigator.serviceWorker.register('/tera/sw.js', { scope: '/tera/' }).catch(function () {});
            });
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Manajemen Aset SMK (PWA, wilayah /admin/): kartu identitas, ikon iPhone, penjaga gudang.
      // Hanya untuk alamat /admin… — halaman publik scan QR TIDAK diberi manifest/service worker.
      (function () {
        try {
          var p = location.pathname;
          var h = document.head;
          var pasang = function (tag, attrs) {
            var el = document.createElement(tag);
            for (var k in attrs) el.setAttribute(k, attrs[k]);
            h.appendChild(el);
          };
          // Portal di "/" dan "/portal-aset" (tanpa nomor label di alamat): hanya ikon & nama iPhone,
          // supaya "Tambahkan ke Layar Utama" memakai logo SMK, bukan huruf "M". Tanpa manifest/service worker.
          var adaLabel = /\d{2,}/.test(location.search + location.hash);
          if ((p === '/' || p === '' || p === '/portal-aset') && !adaLabel) {
            pasang('link', { rel: 'apple-touch-icon', href: '/admin/admin-apple-touch-icon-180.png' });
            pasang('meta', { name: 'apple-mobile-web-app-title', content: 'Aset SMK' });
            return;
          }
          if (!(p === '/admin' || p.indexOf('/admin/') === 0)) return;
          pasang('link', { rel: 'manifest', href: '/admin/manifest.webmanifest' });
          pasang('link', { rel: 'apple-touch-icon', href: '/admin/admin-apple-touch-icon-180.png' });
          pasang('meta', { name: 'apple-mobile-web-app-title', content: 'Aset SMK' });
          pasang('meta', { name: 'mobile-web-app-capable', content: 'yes' });
          pasang('meta', { name: 'apple-mobile-web-app-capable', content: 'yes' });
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
              navigator.serviceWorker.register('/admin/sw.js', { scope: '/admin/' }).catch(function () {});
            });
          }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Sistem Informasi Terpadu Manajemen Aset, Kalibrasi, Logistik & Keuangan PT Sarana Multi Kalibrasi." />
    <meta property="og:title" content="Manajemen Aset SMK" />
    <meta property="og:description" content="Sistem Informasi Terpadu Manajemen Aset, Kalibrasi, Logistik & Keuangan PT Sarana Multi Kalibrasi." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
